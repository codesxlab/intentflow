<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intentflow demo</title>
<style>
  :root{--bg:#f6f6f3;--surface:#fff;--ink:#0d1017;--muted:#565d6b;--line:#e3e4df;--accent:#3352ff;--accent-strong:#2036d1;--accent-soft:#eaedff;--lime:#c8f56a;--dark:#0b0e14;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--surface)}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.02em}
  .brand i{width:28px;height:28px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:var(--lime);font-style:normal;font:700 13px var(--mono)}
  .brand small{font-weight:500;color:var(--muted);font-size:13px}
  .pill{font:500 12px var(--mono);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--muted)}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;max-width:1240px;margin:0 auto;padding:28px}
  h2{font-size:13px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
  textarea{width:100%;min-height:120px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:15px/1.5 var(--sans);background:var(--bg)}
  textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
  .examples{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
  .examples button{border:1px dashed #c9cbc4;background:transparent;border-radius:999px;padding:6px 12px;font:13px var(--sans);color:var(--muted);cursor:pointer}
  .examples button:hover{border-color:var(--accent);color:var(--accent-strong)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btn{border:0;border-radius:999px;padding:11px 20px;font:600 14px var(--sans);cursor:pointer;background:var(--ink);color:#fff}
  .btn:hover{background:var(--accent-strong)}.btn:disabled{opacity:.5;cursor:wait}
  .btn.ok{background:var(--accent)}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  .btn.small{padding:8px 14px;font-size:13px}
  label.reviewer{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
  label.reviewer input{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:13px var(--sans);width:150px;background:var(--bg)}
  .note{margin-top:14px;font-size:14px;color:var(--muted);min-height:1.5em}
  .note.err{color:#b42318}
  .queue{display:grid;gap:14px}
  .empty{color:var(--muted);font-size:14px;padding:28px;text-align:center;border:1px dashed #c9cbc4;border-radius:18px}
  .p-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px}
  .act{font:600 13px var(--mono);color:var(--accent-strong);background:var(--accent-soft);padding:4px 10px;border-radius:8px}
  .st{font:600 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid}
  .st.pending{color:#7a5200;background:#fff4dc;border-color:#f3dfae}
  .st.executed,.st.approved{color:#2c6610;background:#eaf7df;border-color:#d0eabb}
  .st.rejected,.st.failed{color:#9b1c1c;background:#fdecec;border-color:#f6cccc}
  .summary{font-weight:600;margin:0 0 8px}
  blockquote{margin:0 0 12px;padding:8px 12px;border-left:3px solid var(--line);color:var(--muted);font-size:14px}
  pre{margin:0 0 12px;background:var(--dark);color:#d3d9e6;border-radius:12px;padding:12px 14px;font:12.5px/1.7 var(--mono);overflow:auto}
  .result{font-size:14px;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:#eaf7df;color:#2c6610}
  .history{font:12px/1.7 var(--mono);color:var(--muted);margin:10px 0 0;padding:0;list-style:none}
  .meta{font:12px var(--mono);color:var(--muted)}
  @media (max-width:860px){main{grid-template-columns:1fr;padding:16px}header{padding:14px 16px}}
</style>
</head>
<body>
<header>
  <div class="brand"><i>if</i>intentflow <small>demo · by CodesXlab</small></div>
  <span class="pill" id="provider">provider: …</span>
</header>
<main>
  <section>
    <h2>1 · Incoming request</h2>
    <div class="card">
      <textarea id="input" placeholder="Type a request, e.g. “Move our onboarding call to next Tuesday and let the team know.”"></textarea>
      <div class="examples" id="examples"></div>
      <div class="row"><button class="btn" id="propose">Propose action</button></div>
      <p class="note" id="note">The model proposes. Nothing runs until a reviewer approves.</p>
    </div>
  </section>
  <section>
    <div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h2 style="margin:0">2 · Review queue</h2>
      <label class="reviewer">Reviewer <input id="reviewer" value="reviewer" autocomplete="off"></label>
    </div>
    <div class="queue" id="queue"><div class="empty">No proposals yet.</div></div>
  </section>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const examples = [
    "Hi! Could you move our onboarding call to next Tuesday and send the updated agenda to the team?",
    "Email sarah@acme.com about the Q3 invoice, it's overdue.",
    "Add a task for Elif to update the pricing page next week",
    "Wire $5,000 to this account right away.",
  ];
  for (const text of examples) {
    const b = document.createElement("button");
    b.textContent = text.length > 46 ? text.slice(0, 44) + "…" : text;
    b.title = text;
    b.onclick = () => { $("input").value = text; $("input").focus(); };
    $("examples").append(b);
  }

  async function api(path, body) {
    const res = await fetch(path, body ? { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) } : {});
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    return data;
  }

  function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function render(proposals) {
    const q = $("queue"); q.replaceChildren();
    if (!proposals.length) { q.append(el("div", "empty", "No proposals yet.")); return; }
    for (const p of proposals) {
      const card = el("article", "card");
      const head = el("div", "p-head");
      head.append(el("span", "act", p.action), el("span", "st " + p.status, p.status));
      card.append(head, el("p", "summary", p.summary), el("blockquote", null, p.input), el("pre", null, JSON.stringify(p.params, null, 2)));
      if (p.result && p.result.message) card.append(el("p", "result", "✓ " + p.result.message));
      if (p.error) card.append(el("p", "result", "✗ " + p.error));
      if (p.status === "pending") {
        const row = el("div", "row");
        const approve = el("button", "btn ok small", "Approve");
        const reject = el("button", "btn ghost small", "Reject");
        approve.onclick = () => decide(p.id, "approve");
        reject.onclick = () => decide(p.id, "reject");
        row.append(approve, reject);
        card.append(row);
      }
      const hist = el("ul", "history");
      for (const h of p.history) hist.append(el("li", null, `${h.at.slice(11, 19)}  ${h.event}${h.by ? " · " + h.by : ""}${h.note ? " · " + h.note : ""}`));
      card.append(hist);
      q.append(card);
    }
  }

  async function refresh() { render(await api("/api/proposals")); }

  async function decide(id, decision) {
    try { await api(`/api/proposals/${id}/${decision}`, { by: $("reviewer").value }); await refresh(); }
    catch (e) { setNote(e.message, true); }
  }

  function setNote(text, err) { $("note").textContent = text; $("note").className = "note" + (err ? " err" : ""); }

  $("propose").onclick = async () => {
    const input = $("input").value.trim();
    if (!input) return setNote("Type a request first.", true);
    $("propose").disabled = true; setNote("Asking the model…");
    try {
      const { extraction } = await api("/api/extract", { input });
      setNote(extraction.kind === "none" ? "No action proposed: " + extraction.reason : "Proposal added to the review queue.");
      await refresh();
    } catch (e) { setNote(e.message, true); }
    finally { $("propose").disabled = false; }
  };

  api("/api/info").then((i) => { $("provider").textContent = `provider: ${i.provider} · ${i.model}`; });
  refresh();
</script>
</body>
</html>
